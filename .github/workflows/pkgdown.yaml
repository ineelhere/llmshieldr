on:
  release:
    types: [released]

name: pkgdown-stable

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - name: Verify release version and tag
        run: |
          version <- unname(read.dcf("DESCRIPTION", fields = "Version")[1, 1])
          tag <- sub("^refs/tags/", "", Sys.getenv("GITHUB_REF"))
          if (grepl("[.]9000$", version)) {
            stop("Stable pkgdown deployment requires a non-development version.")
          }
          if (!identical(tag, paste0("v", version))) {
            stop("Release tag must equal v", version, "; got ", tag, ".")
          }
        shell: Rscript {0}

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::pkgdown
            local::.
          needs: website

      - name: Build site
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
        shell: Rscript {0}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - id: deployment
        uses: actions/deploy-pages@v4
