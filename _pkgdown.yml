url: https://www.indraneelchakraborty.com/llmshieldr/

template:
  bootstrap: 5
  light-switch: true
  bootswatch: zephyr

development:
  mode: auto

home:
  title: llmshieldr
  description: Safety guardrails for LLM workflows in R, now on CRAN.
  links:
  - text: View CRAN release
    href: https://CRAN.R-project.org/package=llmshieldr

navbar:
  structure:
    left: [intro, reference, articles]
    right: [search, cran, github, lightswitch]
  components:
    intro:
      text: Get Started
      href: articles/getting-started.html
    cran:
      text: CRAN
      href: https://CRAN.R-project.org/package=llmshieldr
    github:
      icon: fa-github
      href: https://github.com/ineelhere/llmshieldr
      aria-label: GitHub

reference:
  - title: Policies and Rules
    contents:
      - build_policy
      - policy
      - available_policies
      - policy_controls
      - add_rule
      - remove_rule
      - list_rules
      - starts_with("rule_")

  - title: Scanners
    contents:
      - scan_prompt
      - preflight_check
      - scan_context
      - scan_output
      - scan_conversation
      - scan_stream
      - stream_guard
      - scan_tool_call
      - scan_tool_output
      - scan_url_target
      - scan_grounding
      - scan_document
      - scanner_options
      - redaction_strategy
      - output_contract
      - validate_output_contract
      - context_policy
      - grounding_policy
      - url_policy
      - document_input
      - entity_recognizer
      - native_recognizers
      - secret_registry

  - title: Orchestration
    contents:
      - secure_chat
      - shield_ollama
      - shield_gemini
      - ollama_reviewer
      - remote_reviewer
      - trust_boundary
      - rate_guard
      - tool_policy
      - guard_tool
      - telemetry_options

  - title: Optional Detector Adapters
    contents:
      - guardrail_provider
      - presidio_provider
      - gitleaks_provider
      - opa_provider

  - title: Audit and Explanation
    contents:
      - write_audit_log
      - explain_findings
      - example_prompts
      - evaluate_security_cases
      - summarize_security_evaluation
      - compare_policies
      - owasp_crosswalk
      - reviewer_prompt

  - title: Constructors
    contents:
      - shieldr_rule
      - shieldr_policy
      - shieldr_report
      - shieldr_audit
      - shieldr_result
      - print.shieldr_policy
      - print.shieldr_report

articles:
  - title: Articles
    navbar: ~
    contents:
      - getting-started
      - ollama-usage
      - gemini-usage
      - policy-design
      - custom-rules
      - rag-pipeline
      - owasp-coverage
      - evaluation
      - threat-model
      - operations
      - architecture
      - ecosystem-context

search:
  enabled: true

footer:
  structure:
    left: [developed_by]
  components:
    developed_by: Developed by <a href="https://www.linkedin.com/in/indraneelchakraborty/" target="_blank">Indraneel Chakraborty</a>
