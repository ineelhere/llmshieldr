<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620"
     role="img" aria-labelledby="title description">
  <title id="title">llmshieldr guarded request workflow</title>
  <desc id="description">User prompts and retrieved context are scanned before reaching the LLM.
  Tool calls and tool output are checked in a loop. Model responses pass output, grounding, and
  contract checks before release. Blocking findings stop processing.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-stop" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7"
            markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/>
    </marker>
    <style>
      .node { fill: #ffffff; stroke: #64748b; stroke-width: 2; }
      .check { fill: #eff6ff; stroke: #2563eb; stroke-width: 2; }
      .llm { fill: #6d28d9; stroke: #5b21b6; stroke-width: 2; }
      .tool { fill: #ecfdf5; stroke: #059669; stroke-width: 2; }
      .stop { fill: #fef2f2; stroke: #dc2626; stroke-width: 2; }
      .flow { fill: none; stroke: #64748b; stroke-width: 2.5; marker-end: url(#arrow); }
      .blocked { fill: none; stroke: #dc2626; stroke-width: 2; stroke-dasharray: 7 6; }
      .blocked-end { fill: none; stroke: #dc2626; stroke-width: 2; stroke-dasharray: 7 6;
                     marker-end: url(#arrow-stop); }
      .label { fill: #172033; font: 600 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
               text-anchor: middle; }
      .label-light { fill: #ffffff; font: 700 20px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
                     text-anchor: middle; }
      .edge-label { fill: #475569; font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
                    text-anchor: middle; }
      .deny-label { fill: #b91c1c; font: 600 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
                    text-anchor: start; }
      @media (prefers-color-scheme: dark) {
        .node { fill: #111827; stroke: #94a3b8; }
        .check { fill: #172554; stroke: #60a5fa; }
        .tool { fill: #052e2b; stroke: #34d399; }
        .stop { fill: #450a0a; stroke: #f87171; }
        .label, .edge-label { fill: #e5e7eb; }
        .deny-label { fill: #fca5a5; }
        .flow { stroke: #94a3b8; }
      }
    </style>
  </defs>

  <!-- Allowed request and response paths -->
  <path class="flow" d="M170 100 H190"/>
  <path class="flow" d="M380 100 C425 100 440 160 485 160"/>
  <path class="flow" d="M170 240 H190"/>
  <path class="flow" d="M410 240 C445 240 450 190 485 190"/>
  <path class="flow" d="M635 175 H690"/>
  <path class="flow" d="M910 175 H1000"/>

  <!-- Tool-call loop -->
  <path class="flow" d="M560 225 V310"/>
  <path class="flow" d="M670 365 H740"/>
  <path class="flow" d="M870 365 H910"/>
  <path class="flow" d="M1030 310 C1030 265 900 270 850 270 H700 C655 270 620 250 600 225"/>

  <!-- Blocking paths share a stop boundary -->
  <path class="blocked" d="M285 145 L250 180 V490 H560"/>
  <path class="blocked" d="M300 295 L330 330 V490 H560"/>
  <path class="blocked" d="M800 230 V290 H1180 V490 H560"/>
  <path class="blocked-end" d="M560 420 V535"/>

  <!-- Input nodes -->
  <rect class="node" x="20" y="70" width="150" height="60" rx="12"/>
  <text class="label" x="95" y="106">User prompt</text>

  <rect class="node" x="20" y="210" width="150" height="60" rx="12"/>
  <text class="label" x="95" y="235">Retrieved</text>
  <text class="label" x="95" y="255">context</text>

  <!-- Policy checks -->
  <path class="check" d="M285 55 L380 100 L285 145 L190 100 Z"/>
  <text class="label" x="285" y="96">Prompt</text>
  <text class="label" x="285" y="116">scan</text>

  <path class="check" d="M300 185 L410 240 L300 295 L190 240 Z"/>
  <text class="label" x="300" y="226">Provenance +</text>
  <text class="label" x="300" y="246">context scan</text>

  <rect class="llm" x="485" y="125" width="150" height="100" rx="18"/>
  <text class="label-light" x="560" y="182">LLM</text>

  <path class="check" d="M800 120 L910 175 L800 230 L690 175 Z"/>
  <text class="label" x="800" y="161">Output + grounding</text>
  <text class="label" x="800" y="181">+ contract</text>

  <rect class="node" x="1000" y="145" width="175" height="60" rx="12"/>
  <text class="label" x="1087.5" y="181">Application</text>

  <path class="check" d="M560 310 L670 365 L560 420 L450 365 Z"/>
  <text class="label" x="560" y="361">Tool policy</text>
  <text class="label" x="560" y="381">check</text>

  <rect class="tool" x="740" y="335" width="130" height="60" rx="12"/>
  <text class="label" x="805" y="371">Tool</text>

  <path class="check" d="M1030 310 L1150 365 L1030 420 L910 365 Z"/>
  <text class="label" x="1030" y="351">Tool-output</text>
  <text class="label" x="1030" y="371">scan</text>

  <rect class="stop" x="510" y="535" width="100" height="55" rx="12"/>
  <text class="label" x="560" y="569">Stop</text>

  <!-- Edge labels -->
  <text class="edge-label" x="430" y="122">allow / redact</text>
  <text class="edge-label" x="438" y="225">admitted rows</text>
  <text class="edge-label" x="955" y="161">safe release</text>
  <text class="edge-label" x="706" y="351">approved</text>
  <text class="edge-label" x="820" y="258">scanned output</text>

  <text class="deny-label" x="260" y="171">block</text>
  <text class="deny-label" x="340" y="326">deny row</text>
  <text class="deny-label" x="570" y="449">deny</text>
  <text class="deny-label" x="1125" y="284">block</text>
</svg>
